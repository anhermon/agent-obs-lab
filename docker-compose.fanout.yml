# Collector fan-out stack — use INSTEAD of docker-compose.yml (not as an overlay).
#
#   docker compose -f docker-compose.fanout.yml up -d --build
#
# Host OTLP (:4317/:4318) is served by the Collector, which fans out to:
#   1) Jaeger (always) — UI http://localhost:16686
#   2) Phoenix (local, zero-key) — UI http://localhost:6006
#
# Collector config is BAKED into the image (see docker/Dockerfile.otel-collector).
# Do not bind-mount the yaml — under DOCKER_HOST=tcp://… the daemon resolves the
# host path on its own filesystem and the mount becomes an empty directory.
#
# Langfuse (scores / cloud): rebuild with
#   COLLECTOR_CONFIG=otel-collector.langfuse.yaml
# (see docs/integrations/langfuse.md). Do NOT dual-SDK the toy agent; keep
# mcp-trace as the sole span producer.

services:
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI only; OTLP stays on the compose network

  phoenix:
    image: arizephoenix/phoenix:version-20.11.0
    ports:
      - "6006:6006"  # UI + OTLP/HTTP
    # OTLP/gRPC is available on phoenix:4317 inside the compose network

  otel-collector:
    build:
      context: ./docker
      dockerfile: Dockerfile.otel-collector
      args:
        COLLECTOR_CONFIG: ${COLLECTOR_CONFIG:-otel-collector.yaml}
    image: agent-obs-lab-otel-collector:local
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"  # OTLP gRPC (mcp-trace default)
      - "4318:4318"  # OTLP HTTP (agent turn parent span)
    depends_on:
      - jaeger
      - phoenix
