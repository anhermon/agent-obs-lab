# OTel Collector fan-out for agent-obs-lab.
# Used by: docker compose -f docker-compose.fanout.yml up -d
#
# Prefer Phoenix first (local, zero-key), then Langfuse for scores
# (see otel-collector.langfuse.yaml — do not dual-SDK the toy agent).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  otlp/phoenix:
    endpoint: phoenix:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, otlp/phoenix, debug]
